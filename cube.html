
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordoir Cube</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121213;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 64px);
      grid-template-rows: repeat(6, 64px);
      gap: 6px;
      touch-action: none;
      user-select: none;
    }

    .tile {
      width: 64px;
      height: 64px;
      background: #3a3a3c;
      border: 2px solid #565758;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    .locked {
      background: #538d4e;
      border-color: #538d4e;
    }

    .info {
      margin-top: 20px;
      text-align: center;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>Wordoir Cube</h1>

  <div id="board" class="board"></div>

  <div class="info">
    Swipe rows or columns to rebuild all 5-letter words.
  </div>

  <script>

    const solvedWords = [
      'FEELS',
      'BOOKS',
      'STONE',
      'LIGHT',
      'BREAD',
      'WAVES'
    ];

    let grid = solvedWords.map(word => word.split(''));

    // SCRAMBLE
    function scramble(times = 30) {
      for (let i = 0; i < times; i++) {
        const type = Math.random() > 0.5 ? 'row' : 'col';

        if (type === 'row') {
          const row = Math.floor(Math.random() * 6);
          const dir = Math.random() > 0.5 ? 1 : -1;
          shiftRow(row, dir);
        } else {
          const col = Math.floor(Math.random() * 5);
          const dir = Math.random() > 0.5 ? 1 : -1;
          shiftColumn(col, dir);
        }
      }
    }

    function shiftRow(row, dir) {
      if (dir === 1) {
        grid[row].unshift(grid[row].pop());
      } else {
        grid[row].push(grid[row].shift());
      }
    }

    function shiftColumn(col, dir) {
      const values = [];

      for (let r = 0; r < 6; r++) {
        values.push(grid[r][col]);
      }

      if (dir === 1) {
        values.unshift(values.pop());
      } else {
        values.push(values.shift());
      }

      for (let r = 0; r < 6; r++) {
        grid[r][col] = values[r];
      }
    }

    function render() {
      board.innerHTML = '';

      for (let r = 0; r < 6; r++) {
        const rowWord = grid[r].join('');
        const solved = solvedWords.includes(rowWord);

        for (let c = 0; c < 5; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';

          if (solved) {
            tile.classList.add('locked');
          }

          tile.textContent = grid[r][c];

          board.appendChild(tile);
        }
      }
    }

    // SWIPE DETECTION
    let startX = 0;
    let startY = 0;
    let startTile = null;

    board.addEventListener('touchstart', e => {
      const touch = e.touches[0];
      startX = touch.clientX;
      startY = touch.clientY;

      startTile = document.elementFromPoint(startX, startY);
    });

    board.addEventListener('touchend', e => {
      const touch = e.changedTouches[0];

      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;

      if (!startTile || !startTile.classList.contains('tile')) return;

      const tiles = [...board.children];
      const index = tiles.indexOf(startTile);

      const row = Math.floor(index / 5);
      const col = index % 5;

      if (Math.abs(dx) > Math.abs(dy)) {
        shiftRow(row, dx > 0 ? 1 : -1);
      } else {
        shiftColumn(col, dy > 0 ? 1 : -1);
      }

      render();
      checkWin();
    });

    function checkWin() {
      const solved = grid.every(row => solvedWords.includes(row.join('')));

      if (solved) {
        setTimeout(() => {
          alert('Puzzle solved!');
        }, 100);
      }
    }

    scramble();
    render();

  </script>
</body>
</html>
